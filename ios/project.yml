# XcodeGen spec: `xcodegen generate` writes KC311.xcodeproj (gitignored)
# from this file. Signing lives in Config/Signing.xcconfig (gitignored, see
# .example). The app gets the city API key itself on first launch
# (KeyRefresher.swift). An optional Config/civic-config.json is bundled by
# scripts/build.sh, which saves that first download.
name: KC311
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  KC311:
    type: application
    platform: iOS
    sources:
      - path: KC311/Sources
      - path: KC311/Resources
    entitlements:
      path: KC311/KC311.entitlements
      properties:
        aps-environment: development
    info:
      path: KC311/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - MaterialSymbolsOutlined.ttf
        NSCameraUsageDescription: Take a photo of the problem you are reporting.
        NSPhotoLibraryUsageDescription: Attach a photo of the problem you are reporting.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).updates
        UIBackgroundModes:
          - fetch
        NSLocationWhenInUseUsageDescription: Pin your report to where you are standing, and show open reports near you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kc311
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
