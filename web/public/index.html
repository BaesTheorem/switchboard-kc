<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An unofficial app for Kansas City, Missouri 311: report a problem, track your reports, and find city services.">
  <meta name="theme-color" content="#fafaff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121217" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Switchboard">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Switchboard KC</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header id="appbar">
    <button class="transparent circle" id="back" type="button" aria-label="Back" hidden><i aria-hidden="true">arrow_back</i></button>
    <h1 id="title">Switchboard KC</h1>
    <button class="transparent circle" id="cog" type="button" aria-label="Settings"><i aria-hidden="true">settings</i></button>
  </header>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="bottom" id="tabs" aria-label="Sections">
    <a href="#/report" data-tab="report"><i aria-hidden="true">add_a_photo</i><span>Report</span></a>
    <a href="#/services" data-tab="services"><i aria-hidden="true">list_alt</i><span>Services</span></a>
    <a href="#/reports" data-tab="reports"><i aria-hidden="true">map</i><span>Reports</span></a>
    <a href="#/city" data-tab="city"><i aria-hidden="true">account_balance</i><span>City</span></a>
  </nav>
  <dialog id="sheet" aria-modal="true"></dialog>
  <div class="snackbar" id="snack" role="status" aria-live="polite"></div>
  <noscript><p class="screen">This app needs JavaScript. For an emergency, call 911. For the city, call 311 (816-513-1313).</p></noscript>
</body>
</html>
